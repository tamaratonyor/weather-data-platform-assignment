name: 'weather_data_platform'
version: '1.0.0'
config-version: 2

profile: 'weather_data_platform'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Elements we know how to narrate / display. Inventory still drives WHICH
  # of these each station actually has -- this is an allowlist so we don't
  # pivot into 40 obscure element columns, not a per-station hardcode.
  supported_elements: ['TMAX', 'TMIN', 'PRCP', 'SNOW', 'SNWD', 'AWND']
  # Scope window -- adjust here only, no SQL changes needed.
  start_date: '2024-01-01'
  end_date: '2025-12-31'

models:
  weather_data_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
